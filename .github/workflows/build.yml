name: Build
on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint & Test & Build
        run: ./gradlew clean detekt test assemble --info

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run IDE end-to-end tests
        run: ./gradlew integrationTest --info

      - name: Publish JUnit test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@v2
        with:
          name: E2E Tests
          path: build/test-results/integrationTest/TEST-*.xml
          reporter: java-junit
          use-actions-summary: 'false'

      - name: Upload end-to-end test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-artifacts
          path: |
            build/test-results/integrationTest/
            build/reports/tests/integrationTest/
            out/ide-tests/tests/**/log/
            out/ide-tests/tests/**/reports/
          if-no-files-found: warn
          retention-days: 7

  e2e-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum-ide
            os: ubuntu-latest
            ide-version: '2023.3.8'
          - name: macos
            os: macos-latest
            ide-version: '2026.2.4'
          - name: windows
            os: windows-latest
            ide-version: '2026.2.4'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
    env:
      E2E_IDE_VERSION: ${{ matrix.ide-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run IDE smoke tests
        run: ./gradlew integrationSmokeTest --info

      - name: Publish JUnit test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@v2
        with:
          name: E2E Smoke Tests (${{ matrix.name }})
          path: build/test-results/integrationSmokeTest/TEST-*.xml
          reporter: java-junit
          use-actions-summary: 'false'

      - name: Upload end-to-end test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-${{ matrix.name }}-artifacts
          path: |
            build/test-results/integrationSmokeTest/
            build/reports/tests/integrationSmokeTest/
            out/ide-tests/tests/**/log/
            out/ide-tests/tests/**/reports/
          if-no-files-found: warn
          retention-days: 7

name: Build
on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint & Test & Build
        run: ./gradlew clean detekt test assemble --info

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run IDE end-to-end tests
        run: ./gradlew integrationTest --info

      - name: Upload end-to-end test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-artifacts
          path: |
            build/test-results/integrationTest/
            build/reports/tests/integrationTest/
            out/ide-tests/tests/**/log/
            out/ide-tests/tests/**/reports/
          if-no-files-found: warn
          retention-days: 7
